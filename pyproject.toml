# pyproject.toml
[project]
name = "python-gcp-ai-lab"
version = "0.1.0"
description = "Portfolio lab: a fictional shipping quote service with a Gemini-powered assistant (RAG and a small agent) on Google Cloud."
readme = "README.md"
authors = [
    { name = "Ramiro Alarcon Lasagno", email = "ing.ramiro.a.l@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
