# pyproject.toml
[project]
name = "python-gcp-ai-lab"
version = "0.1.0"
description = "Portfolio lab: a fictional shipping quote service with a Gemini-powered assistant (RAG and a small agent) on Google Cloud."
readme = "README.md"
authors = [
    { name = "Ramiro Alarcon Lasagno", email = "ing.ramiro.a.l@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Integration tests need the docker compose database; they are skipped by default.
# Run them with: uv run pytest -m integration (or -m "" for everything).
markers = ["integration: needs the PostgreSQL database from docker compose"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
