# .pre-commit-config.yaml
# Hooks that run before each commit. Install them with: uv run pre-commit install
repos:
  # Secret detection on staged changes (official hook, built with Go by pre-commit).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lint and type checks run through uv so they use the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy app
        entry: uv run mypy app
        language: unsupported
        types: [python]
        pass_filenames: false
